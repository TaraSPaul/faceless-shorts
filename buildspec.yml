version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 970817257663.dkr.ecr.us-east-1.amazonaws.com
  build:
    commands:
      - echo Building linux/arm64 image on native Graviton...
      - docker build -t 970817257663.dkr.ecr.us-east-1.amazonaws.com/faceless-shorts-agent:latest .
  post_build:
    commands:
      - echo Pushing image to Amazon ECR...
      - docker push 970817257663.dkr.ecr.us-east-1.amazonaws.com/faceless-shorts-agent:latest
      - echo Image push complete!
