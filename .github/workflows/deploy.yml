# ─────────────────────────────────────────────────────────────────────────────
# deploy.yml — Production CI/CD Pipeline for Faceless Shorts AgentCore
#
# Builds linux/arm64 Docker image & pushes to Amazon ECR on push to main
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: faceless-shorts-agent
  AWS_ACCOUNT_ID: "970817257663"

jobs:
  build-and-push:
    name: Build arm64 Image & Push to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ECR_URI="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}"
          echo "short_sha=${SHORT_SHA}"            >> $GITHUB_OUTPUT
          echo "image_latest=${ECR_URI}:latest"    >> $GITHUB_OUTPUT
          echo "image_sha=${ECR_URI}:${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Image URI: ${ECR_URI}:${SHORT_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.image_latest }}
            ${{ steps.tags.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment summary
        run: |
          echo "=============================================="
          echo "  Image pushed successfully!"
          echo "  Latest Tag : ${{ steps.tags.outputs.image_latest }}"
          echo "  Commit Tag : ${{ steps.tags.outputs.image_sha }}"
          echo "=============================================="
